
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urban-sensors-producer
  namespace: urban-streaming
  labels:
    app: urban-sensors-producer
    app.kubernetes.io/part-of: urban-data-platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app: urban-sensors-producer

  template:
    metadata:
      labels:
        app: urban-sensors-producer

    spec:
      containers:
        - name: producer
          image: urban-sensors-producer:1.0
          imagePullPolicy: IfNotPresent

          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: KAFKA_TOPIC
              value: "urban_sensors"

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
