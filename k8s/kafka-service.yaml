
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: urban-streaming
  labels:
    app: kafka
    app.kubernetes.io/part-of: urban-data-platform
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: client
      protocol: TCP
      port: 9092
      targetPort: 9092
    - name: controller
      protocol: TCP
      port: 9093
      targetPort: 9093
